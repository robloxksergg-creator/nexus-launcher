name: Publish coordinated 1.0.8 preview after native acceptance
'on':
  push:
    branches: [release/publish-cross-platform-1.0.8]
permissions:
  contents: write
  actions: read
concurrency:
  group: nexus-publish-cross-platform-1.0.8
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: robloxksergg-creator/nexus-launcher
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify all source runs and pinned artifact provenance
        run: |
          python - <<'PY'
          import json,os,urllib.request
          root='https://api.github.com/repos/'+os.environ['GH_REPO']
          def get(path):
            req=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          rows=[(42031708870,13417275377,'b4059281ee94cdd3d1aa34b42c26b8277fa0750351a2836b3f058d2dd9db9582'),(42031708772,13416299166,'f52ba896a472fef4d4adde90377b9d50ad6aa08d8385253542da3b65d1378788'),(42031708824,13418320573,'e476b30e5c6114ae3909114ef649684b415e36fe70b3d017b549dcc98fd3270b'),(42031708895,13416088589,'c8aff94d188a451ed556d9a43aa32c35426bcb14751513709cb4b7825e2b3258')]
          for run_id,artifact_id,sha in rows:
            run=get('/actions/runs/'+str(run_id));assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']=='e2440128336b3cd9c60e190d2e010738c8de26a3'
            a=get('/actions/artifacts/'+str(artifact_id));assert not a['expired'] and a['workflow_run']['id']==run_id and a['digest']=='sha256:'+sha
          acceptance=get('/actions/runs/42033617550');assert acceptance['status']=='completed' and acceptance['conclusion']=='success' and acceptance['head_sha']=='dfa15a62e6c65f8501b16f753d8cd14ee33730e7'
          a=get('/actions/artifacts/13417248482');assert not a['expired'] and a['workflow_run']['id']==42033617550 and a['digest']=='sha256:030ff19bdbea4fc7126aea7f2c968ecd639bcf12bcb50e3e9cd13cf0da1e45c7'
          audit=get('/actions/runs/42035814049');assert audit['status']=='completed' and audit['conclusion']=='success' and audit['head_sha']=='cde2ea38154c274ca40b0aa20fbd40110acf3de4'
          comparison=get('/compare/e2440128336b3cd9c60e190d2e010738c8de26a3...cde2ea38154c274ca40b0aa20fbd40110acf3de4')
          assert {f['filename'] for f in comparison['files']}=={'.github/workflows/posix-autoupdate-audit.yml','tests/test_mod_catalog.py','tests/test_window_chrome.py'}
          print('Full native audit, unchanged audited product source, three native builds and artifact identities confirmed')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: '13417275377'
          run-id: 42031708870
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: '13416299166'
          run-id: 42031708772
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: '13418320573'
          run-id: 42031708824
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs/macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: '13416088589'
          run-id: 42031708895
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs/installer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: '13417248482'
          run-id: 42033617550
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs/acceptance
      - name: Verify packages, offline signature and acceptance; prepare release
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.1
          python -B packaging/prepare_public_variant.py --source . --destination "$RUNNER_TEMP/verification-source" --version 1.0.8
          export PYTHONPATH="$RUNNER_TEMP/verification-source"
          python -B packaging/releases/1.0.8/prepare.py --input "$RUNNER_TEMP/inputs" --output "$RUNNER_TEMP/release" --approval packaging/releases/1.0.8/approval.json
      - name: Publish all platform assets under one preview release
        run: |
          if gh release view v1.0.8-preview.1 >/dev/null 2>&1; then echo 'Release already exists; refusing to overwrite'; exit 1; fi
          gh release create v1.0.8-preview.1 --target e2440128336b3cd9c60e190d2e010738c8de26a3 --title 'NEXUS Launcher 1.0.8 - Cross-platform Updates Beta' --notes-file "$RUNNER_TEMP/release/RELEASE-NOTES.md" --draft --prerelease "$RUNNER_TEMP/release/"*
          gh release edit v1.0.8-preview.1 --draft=false --prerelease --latest=false
      - name: Verify public package links before switching signed update feed
        run: |
          for name in NEXUS-Setup.exe NEXUS-Managed-1.0.8-Windows-x64.zip NEXUS-1.0.8-Linux-x64.tar.gz NEXUS-1.0.8-macOS-arm64.zip NEXUS-Update-1.0.8-Linux-x64.zip NEXUS-Update-1.0.8-macOS-arm64.zip portable-envelope.json posix-envelope-linux-x64.json posix-envelope-macos-arm64.json; do
            curl --fail --silent --show-error --head --location --max-time 60 "https://github.com/$GH_REPO/releases/download/v1.0.8-preview.1/$name" >/dev/null
          done
          python - <<'PY'
          import json,os,pathlib,urllib.request,hashlib
          url='https://api.github.com/repos/'+os.environ['GH_REPO']+'/releases/tags/v1.0.8-preview.1'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as r: release=json.load(r)
          assert not release['draft'] and release['prerelease']
          assets={a['name']:a for a in release['assets']}
          for p in (pathlib.Path(os.environ['RUNNER_TEMP'])/'release').iterdir():
            if p.is_file():
              with p.open('rb') as f: sha=hashlib.file_digest(f,'sha256').hexdigest()
              assert assets[p.name]['size']==p.stat().st_size and assets[p.name]['digest']=='sha256:'+sha,p.name
          print('Every public release asset digest and size matches the verified local input')
          PY
          mkdir "$RUNNER_TEMP/previous-feed"
          gh release download updates-preview --pattern portable-envelope.json --dir "$RUNNER_TEMP/previous-feed"
          python -B -c "import hashlib,pathlib,os; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'previous-feed/portable-envelope.json'; assert hashlib.sha256(p.read_bytes()).hexdigest()=='bcf33636a248c699d9f08a65882fec31ca8679aa1cbdbe620feb3c2cd9942fb9', 'Existing update feed changed; refusing replacement'"
          python - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GH_REPO']+'/releases/tags/updates-preview',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r:data=json.load(r)
          assert not ({'posix-envelope-linux-x64.json','posix-envelope-macos-arm64.json'} & {a['name'] for a in data['assets']}),'POSIX feed already exists; refusing replacement'
          PY
          gh release upload updates-preview "$RUNNER_TEMP/release/posix-envelope-linux-x64.json" "$RUNNER_TEMP/release/posix-envelope-macos-arm64.json"
          gh release upload updates-preview "$RUNNER_TEMP/release/portable-envelope.json" --clobber
      - name: Verify active update feed bytes after replacement
        run: |
          mkdir "$RUNNER_TEMP/published-feed"
          gh release download updates-preview --pattern "*envelope*.json" --dir "$RUNNER_TEMP/published-feed"
          python -B -c "import pathlib,os; p=pathlib.Path(os.environ['RUNNER_TEMP']); names=['portable-envelope.json','posix-envelope-linux-x64.json','posix-envelope-macos-arm64.json']; assert all((p/'published-feed'/n).read_bytes()==(p/'release'/n).read_bytes() for n in names), 'Published feed mismatch'; print('All three active signed feeds match verified 1.0.8 envelopes')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nexus-1.0.8-publication-receipts
          retention-days: 5
          path: |
            ${{ runner.temp }}/previous-feed/portable-envelope.json
            ${{ runner.temp }}/release/SHA256SUMS.txt
            ${{ runner.temp }}/release/windows-update-acceptance.json
            ${{ runner.temp }}/release/windows-install-acceptance.json
            ${{ runner.temp }}/published-feed/*.json
