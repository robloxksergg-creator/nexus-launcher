name: Publish coordinated 1.0.6 preview after native acceptance
'on':
  push:
    branches: [release/publish-cross-platform-1.0.6]
permissions:
  contents: write
  actions: read
concurrency:
  group: nexus-publish-cross-platform-1.0.6
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: robloxksergg-creator/nexus-launcher
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify all source runs and pinned artifact provenance
        run: |
          python - <<'PY'
          import json,os,urllib.request
          root='https://api.github.com/repos/'+os.environ['GH_REPO']
          def get(path):
            req=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          rows=[(41596793180,13211919901,'63a5f0a23965fd8c9c5a16c99997a6aa299de9a6ed507329a569cb96929733f8'),(41596793232,13212881468,'6b9ce53726dc04c463412e34f1946014f6e2608071d00928c64be049b9e83cef'),(41596793201,13213080241,'614bd82ebcc3740adb02926160fcf4e90cc448c1e9cee9648ebc90d4a37408d7')]
          for run_id,artifact_id,sha in rows:
            run=get('/actions/runs/'+str(run_id));assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']=='29f9cb6a2a1796ab0a0e1b2a23d618b03822f4d8'
            a=get('/actions/artifacts/'+str(artifact_id));assert not a['expired'] and a['workflow_run']['id']==run_id and a['digest']=='sha256:'+sha
          acceptance=get('/actions/runs/41599324889');assert acceptance['status']=='completed' and acceptance['conclusion']=='success' and acceptance['head_sha']=='32d301c88e8a9cf9f793e708028a46e5fcdc76d1'
          audit=get('/actions/runs/41519587569');assert audit['status']=='completed' and audit['conclusion']=='success' and audit['head_sha']=='a92a9109446cb74d5727a96848ac83fe7b68fa22'
          comparison=get('/compare/a92a9109446cb74d5727a96848ac83fe7b68fa22...29f9cb6a2a1796ab0a0e1b2a23d618b03822f4d8')
          assert {f['filename'] for f in comparison['files']}=={'.github/workflows/branding-launcher.yml','.github/workflows/linux-launcher.yml','.github/workflows/macos-launcher.yml'}
          print('Full native audit, unchanged audited product source, three native builds and artifact identities confirmed')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: '13211919901'
          run-id: 41596793180
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: '13212881468'
          run-id: 41596793232
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: '13213080241'
          run-id: 41596793201
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs/macos
      - name: Verify packages, offline signature and acceptance; prepare release
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.1
          python -B packaging/releases/1.0.6/prepare.py --input "$RUNNER_TEMP/inputs" --output "$RUNNER_TEMP/release" --approval packaging/releases/1.0.6/approval.json --notes packaging/releases/1.0.6/RELEASE-NOTES.md --acceptance packaging/releases/1.0.6/windows-acceptance.json
      - name: Publish all platform assets under one preview release
        run: |
          if gh release view v1.0.6-preview.1 >/dev/null 2>&1; then echo 'Release already exists; refusing to overwrite'; exit 1; fi
          gh release create v1.0.6-preview.1 --target 29f9cb6a2a1796ab0a0e1b2a23d618b03822f4d8 --title 'NEXUS Launcher 1.0.6 — Package Protection Preview' --notes-file "$RUNNER_TEMP/release/RELEASE-NOTES.md" --draft --prerelease "$RUNNER_TEMP/release/"*
          gh release edit v1.0.6-preview.1 --draft=false --prerelease --latest=false
      - name: Verify public package links before switching signed update feed
        run: |
          for name in NEXUS-Setup.exe NEXUS-Managed-1.0.6-Windows-x64.zip NEXUS-1.0.6-Linux-x64.tar.gz NEXUS-1.0.6-macOS-arm64.zip portable-envelope.json; do
            curl --fail --silent --show-error --head --location --max-time 60 "https://github.com/$GH_REPO/releases/download/v1.0.6-preview.1/$name" >/dev/null
          done
          mkdir "$RUNNER_TEMP/previous-feed"
          gh release download updates-preview --pattern portable-envelope.json --dir "$RUNNER_TEMP/previous-feed"
          python -B -c "import hashlib,pathlib,os; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'previous-feed/portable-envelope.json'; assert hashlib.sha256(p.read_bytes()).hexdigest()=='44b3ef04650dfcd484c1fbd53f14d972df117856f068a63151ce2e6cb1e1303f', 'Existing update feed changed; refusing replacement'"
          gh release upload updates-preview "$RUNNER_TEMP/release/portable-envelope.json" --clobber
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nexus-1.0.6-publication-receipts
          retention-days: 5
          path: |
            ${{ runner.temp }}/previous-feed/portable-envelope.json
            ${{ runner.temp }}/release/SHA256SUMS.txt
            ${{ runner.temp }}/release/windows-update-acceptance.json
