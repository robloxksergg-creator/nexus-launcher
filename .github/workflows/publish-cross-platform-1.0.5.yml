name: Publish coordinated 1.0.5 preview after native acceptance
'on':
  push:
    branches: [release/publish-cross-platform-1.0.5]
permissions:
  contents: write
  actions: read
concurrency:
  group: nexus-publish-cross-platform-1.0.5
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: robloxksergg-creator/nexus-launcher
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify all source runs and pinned artifact provenance
        run: |
          python - <<'PY'
          import json,os,urllib.request
          root='https://api.github.com/repos/'+os.environ['GH_REPO']
          def get(path):
            req=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          rows=[(41491383374,13163833851,'6be003eb7c646fb78768d3166517df0beebd8754cd66619ec60678ccccde6c33'),(41491383373,13165021036,'a3373cd25c1662368d5da1c1276aad50bf429b8fa379869c923780e7b3673c8f'),(41491383372,13164578407,'56789549ffb89e918461ef08be5eec48435efea0c558dff7b2673a26ba39e799')]
          for run_id,artifact_id,sha in rows:
            run=get('/actions/runs/'+str(run_id));assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']=='d5dd5404462a071a743ea55a2e4873e7c668fc53'
            a=get('/actions/artifacts/'+str(artifact_id));assert not a['expired'] and a['workflow_run']['id']==run_id and a['digest']=='sha256:'+sha
          print('Three successful native runs and exact artifact identities confirmed')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: '13163833851'
          run-id: 41491383374
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: '13165021036'
          run-id: 41491383373
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: '13164578407'
          run-id: 41491383372
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs/macos
      - name: Verify packages, offline signature and acceptance; prepare release
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.1
          python -B packaging/releases/1.0.5/prepare.py --input "$RUNNER_TEMP/inputs" --output "$RUNNER_TEMP/release" --approval packaging/releases/1.0.5/approval.json --notes packaging/releases/1.0.5/RELEASE-NOTES.md --acceptance packaging/releases/1.0.5/windows-acceptance.json
      - name: Publish all platform assets under one preview release
        run: |
          if gh release view v1.0.5-preview.1 >/dev/null 2>&1; then echo 'Release already exists; refusing to overwrite'; exit 1; fi
          gh release create v1.0.5-preview.1 --target d5dd5404462a071a743ea55a2e4873e7c668fc53 --title 'NEXUS Launcher 1.0.5 — Pre-installation Check Preview' --notes-file "$RUNNER_TEMP/release/RELEASE-NOTES.md" --draft --prerelease "$RUNNER_TEMP/release/"*
          gh release edit v1.0.5-preview.1 --draft=false --prerelease --latest=false
      - name: Verify public package links before switching signed update feed
        run: |
          for name in NEXUS-Setup.exe NEXUS-Managed-1.0.5-Windows-x64.zip NEXUS-1.0.5-Linux-x64.tar.gz NEXUS-1.0.5-macOS-arm64.zip portable-envelope.json; do
            curl --fail --silent --show-error --head --location --max-time 60 "https://github.com/$GH_REPO/releases/download/v1.0.5-preview.1/$name" >/dev/null
          done
          mkdir "$RUNNER_TEMP/previous-feed"
          gh release download updates-preview --pattern portable-envelope.json --dir "$RUNNER_TEMP/previous-feed"
          gh release upload updates-preview "$RUNNER_TEMP/release/portable-envelope.json" --clobber
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nexus-1.0.5-publication-receipts
          retention-days: 5
          path: |
            ${{ runner.temp }}/previous-feed/portable-envelope.json
            ${{ runner.temp }}/release/SHA256SUMS.txt
            ${{ runner.temp }}/release/windows-update-acceptance.json
