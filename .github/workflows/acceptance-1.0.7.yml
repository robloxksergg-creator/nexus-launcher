name: Verify exact signed 1.0.6 to 1.0.7 packages
'on':
  push:
    branches: [release/acceptance-1.0.7]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install existing signature and completion UI dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.1 PySide6==6.8.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: '13348671594'
          run-id: 41878339271
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: '13346624887'
          run-id: 41878339161
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/installer
      - name: Verify and execute only the exact signed launcher packages
        run: |
          $ErrorActionPreference = 'Stop'
          python -B packaging/prepare_public_variant.py --source . --destination "$env:RUNNER_TEMP\harness-source" --version 1.0.7
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PYTHONPATH = "$env:RUNNER_TEMP\harness-source"
          python -B packaging/releases/1.0.7/verify_ci_update.py --inputs "$env:RUNNER_TEMP\candidate" --approval packaging/releases/1.0.7/approval.json --output "$env:RUNNER_TEMP\acceptance-receipts" --root "$env:SystemDrive\nx107-ci" --installer "$env:RUNNER_TEMP\installer\NEXUS-Setup.exe"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: signed-1.0.7-update-acceptance
          retention-days: 5
          path: |
            ${{ runner.temp }}/acceptance-receipts/*.json
            ${{ runner.temp }}/acceptance-receipts/*.png
