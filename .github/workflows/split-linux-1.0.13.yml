name: Split verified Linux 1.0.13 artifact without changing package bytes
'on':
  push:
    branches: [release/split-linux-1.0.13-r3]
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify native build and original artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          base='https://api.github.com/repos/robloxksergg-creator/nexus-launcher'
          def get(p):
            req=urllib.request.Request(base+p,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          run=get('/actions/runs/43629446133');assert run['conclusion']=='success' and run['head_sha']=='f5f2786697b567b351aa7a4ce23f1d068067423c'
          a=get('/actions/artifacts/14127802000');assert not a['expired'] and a['digest']=='sha256:67272cdda7305488195bfd43fbfb9f3bdef8d7ee506b1933b67ceaf99e360a45'
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14127802000'
          run-id: 43629446133
          repository: robloxksergg-creator/nexus-launcher
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux
      - name: Record unmodified inner package hashes
        run: |
          python - <<'PY'
          import pathlib,hashlib,json,os
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'linux'
          names=['NEXUS-1.0.13-Linux-x64.tar.gz','NEXUS-Update-1.0.13-Linux-x64.zip','posix-inventory-linux-x64.json','posix-update-receipts/native-posix-update-acceptance.json']
          receipt={'original_artifact':14127802000,'source_commit':'f5f2786697b567b351aa7a4ce23f1d068067423c','files':{}}
          for name in names:
            with (p/name).open('rb') as f:sha=hashlib.file_digest(f,'sha256').hexdigest()
            receipt['files'][name]={'sha256':sha,'size':(p/name).stat().st_size}
          (p/'original-artifact-provenance.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-linux-1.0.13-distribution
          retention-days: 14
          path: |
            ${{ runner.temp }}/linux/NEXUS-1.0.13-Linux-x64.tar.gz
            ${{ runner.temp }}/linux/SHA256SUMS-Linux.txt
            ${{ runner.temp }}/linux/original-artifact-provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-linux-1.0.13-update
          retention-days: 14
          path: |
            ${{ runner.temp }}/linux/NEXUS-Update-1.0.13-Linux-x64.zip
            ${{ runner.temp }}/linux/posix-inventory-linux-x64.json
            ${{ runner.temp }}/linux/original-artifact-provenance.json
            ${{ runner.temp }}/linux/posix-update-receipts/native-posix-update-acceptance.json

