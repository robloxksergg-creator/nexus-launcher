name: Second-factor native form verification
'on':
  push:
    branches: [auth/verify-two-factor]
permissions:
  contents: read
jobs:
  second-factor:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - shell: pwsh
        env:
          NEXUS_TWO_FACTOR_SCREENSHOT: ${{ runner.temp }}/two-factor-login.png
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests -p test_two_factor_ui.py -v
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: second-factor-form-review
          retention-days: 5
          path: ${{ runner.temp }}/two-factor-login.png
