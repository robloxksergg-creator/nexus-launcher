name: Verify branded managed launcher
'on':
  workflow_dispatch:
  push:
    branches: [branding/verify-launcher]
permissions:
  contents: read
jobs:
  launcher:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: windows
      PYO3_BUILD_EXTENSION_MODULE: '1'
      PYO3_USE_RAW_DYLIB: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install existing pinned build dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r packaging/requirements/requirements-media.txt -r packaging/requirements/requirements-markdown.txt pytest==9.1.1 maturin==1.15.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup toolchain install 1.99.1-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=1.99.1-x86_64-pc-windows-msvc" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP\nexus-target" >> $env:GITHUB_ENV
          "PYO3_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> $env:GITHUB_ENV
      - name: Build Rust extension from this checkout
        run: |
          cargo test --locked -p nexus-core -p nexus-transport
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $libraries = python -c "import sys,pathlib; print(pathlib.Path(sys.executable).parent / 'libs')"
          python -m maturin build --locked --release --manifest-path crates/nexus-python/Cargo.toml --out "$env:RUNNER_TEMP\wheels" -- -L "native=$libraries"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --no-index --no-deps (Get-ChildItem "$env:RUNNER_TEMP\wheels" -Filter '*.whl').FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test asset and package contracts
        run: |
          python -B -m pytest tests/test_portable_assets.py tests/test_public_variant.py tests/test_public_update_identity.py tests/test_portable_transition.py tests/test_bootstrap_installation.py tests/test_github_updates.py -q -p no:cacheprovider
          exit $LASTEXITCODE
      - name: Render icons and collect component notices
        run: |
          python -B packaging/build_brand_icons.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -c "import importlib.metadata as m,runpy,sys; runpy.run_path('packaging/collect_python_notices.py')['collect'](sorted({d.metadata['Name'] for d in m.distributions() if d.metadata['Name']}),sys.argv[1])" "$env:RUNNER_TEMP\python-notices"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fetch --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $cargoCache = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          python -B packaging/collect_locked_rust_notices.py --lockfile Cargo.lock --cache "$cargoCache\registry\cache" --output "$env:RUNNER_TEMP\rust-notices"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Invoke-WebRequest -Uri 'https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qtwebengine-everywhere-src-6.8.3.tar.xz' -OutFile "$env:RUNNER_TEMP\qt-source.tar.xz" -TimeoutSec 180
          python -B packaging/collect_source_notices.py --archive "$env:RUNNER_TEMP\qt-source.tar.xz" --sha256 df4e19ba2b3a540551b6f998d62597377ffa688c1cff564589b7da2e2bf87337 --prefix qtwebengine-everywhere-src-6.8.3 --output "$env:RUNNER_TEMP\qt-notices"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B packaging/assemble_notice_bundle.py --output "$env:RUNNER_TEMP\combined-notices" --group "python=$env:RUNNER_TEMP\python-notices" --group "rust=$env:RUNNER_TEMP\rust-notices" --group "qtwebengine-source=$env:RUNNER_TEMP\qt-notices"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build complete managed application with actual version 1.0.3
        run: |
          $env:NEXUS_CANDIDATE_NOTICES = "$env:RUNNER_TEMP\combined-notices"
          python -B packaging/prepare_public_variant.py --source . --destination "$env:RUNNER_TEMP\source-v103" --version 1.0.3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -m PyInstaller --noconfirm --distpath "$env:RUNNER_TEMP\managed" --workpath "$env:RUNNER_TEMP\managed-work" "$env:RUNNER_TEMP\source-v103\packaging\specs\NexusManagedPublic.spec"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B packaging/candidate_inventory.py --root "$env:RUNNER_TEMP\managed\NEXUS Managed Launcher" --output "$env:RUNNER_TEMP\managed\MANAGED-FILES.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -c "import pathlib,zipfile,sys; root=pathlib.Path(sys.argv[1]); z=zipfile.ZipFile(sys.argv[2],'w',zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(root).as_posix()) for p in sorted(root.rglob('*')) if p.is_file()]; z.close()" "$env:RUNNER_TEMP\managed\NEXUS Managed Launcher" "$env:RUNNER_TEMP\managed\NEXUS-Managed-1.0.3-Windows-x64.zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-managed-branding-review
          retention-days: 5
          path: |
            ${{ runner.temp }}/managed/NEXUS-Managed-1.0.3-Windows-x64.zip
            ${{ runner.temp }}/managed/MANAGED-FILES.json
