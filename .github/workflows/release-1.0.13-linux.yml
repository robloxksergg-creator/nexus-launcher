name: NEXUS 1.0.13 candidate - linux

'on':
  workflow_dispatch:
  push:
    branches: [release/verify-1.0.13]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build and Qt system dependencies on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libegl1 libopengl0 libnss3 libasound2t64 libpulse0 xvfb dbus-x11
          python -m pip install --disable-pip-version-check -r requirements.txt -r packaging/requirements/requirements-media.txt -r packaging/requirements/requirements-markdown.txt pytest==9.1.1 maturin==1.15.0
          rustup toolchain install 1.99.1 --profile minimal
          echo 'RUSTUP_TOOLCHAIN=1.99.1' >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/nexus-target" >> "$GITHUB_ENV"
      - name: Build existing Rust extension for Linux
        run: |
          cargo test --locked -p nexus-core -p nexus-transport
          python -m maturin build --locked --release --manifest-path crates/nexus-python/Cargo.toml --out "$RUNNER_TEMP/wheels"
          python -m pip install --no-index --no-deps "$RUNNER_TEMP"/wheels/*.whl
      - name: Test Linux entrypoint and shared platform contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -B -m unittest discover -s tests -p test_linux_entrypoint.py -v
          python -B -m pytest tests/test_platform_support.py tests/test_nexus_account.py tests/test_registration.py -q -p no:cacheprovider
      - name: Shared diagnostics, dependency review, trial and second-factor regressions
        env:
          QT_QPA_PLATFORM: offscreen
          NEXUS_DIAGNOSTICS_SCREENSHOT: ${{ runner.temp }}/diagnostics.png
          NEXUS_TRIAL_REVIEW_SCREENSHOT: ${{ runner.temp }}/trial-review.png
          NEXUS_TRIAL_RESULT_SCREENSHOT: ${{ runner.temp }}/trial-result.png
        run: |
          python -B -m pytest tests/test_updater.py tests/test_server_controller.py tests/test_live_revocation.py tests/test_package_security_boundary.py tests/test_panel_credential_boundary.py tests/test_protection_adversarial.py tests/test_server_pack_review.py tests/test_manifest_profile.py tests/test_preinstall_check.py tests/test_preinstall_ui.py tests/test_design_action_boundary.py tests/test_instance_diagnostics.py tests/test_nested_diagnostics.py tests/test_dependency_versions.py tests/test_diagnostic_version_bindings.py tests/test_instance_diagnostics_ui.py tests/test_diagnostic_versions_ui.py tests/test_diagnostic_workspace_ui.py tests/test_diagnostic_trial.py tests/test_diagnostic_trial_ui.py tests/test_two_factor_ui.py tests/test_nexus_account.py tests/test_auth_state.py -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/feature-tests.xml"
      - name: Collect component notices
        run: |
          curl --fail --location --max-time 180 'https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.3-src/pyside-setup-everywhere-src-6.8.3.tar.xz' --output "$RUNNER_TEMP/pyside-source.tar.xz"
          python -B packaging/collect_source_notices.py --archive "$RUNNER_TEMP/pyside-source.tar.xz" --sha256 d2c896f7f1a6a7ea4c9f98cfe317272fd139703ddf612b86999f09e48aeef0e6 --prefix pyside-setup-everywhere-src-6.8.3 --output "$RUNNER_TEMP/pyside-notices"
          python -B packaging/collect_linux_python_notices.py --output "$RUNNER_TEMP/python-notices" --pyside-notices "$RUNNER_TEMP/pyside-notices"
          cargo fetch --locked
          python -B packaging/collect_locked_rust_notices.py --lockfile Cargo.lock --cache "${CARGO_HOME:-$HOME/.cargo}/registry/cache" --output "$RUNNER_TEMP/rust-notices"
          curl --fail --location --max-time 180 'https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qtwebengine-everywhere-src-6.8.3.tar.xz' --output "$RUNNER_TEMP/qt-source.tar.xz"
          python -B packaging/collect_source_notices.py --archive "$RUNNER_TEMP/qt-source.tar.xz" --sha256 df4e19ba2b3a540551b6f998d62597377ffa688c1cff564589b7da2e2bf87337 --prefix qtwebengine-everywhere-src-6.8.3 --output "$RUNNER_TEMP/qt-notices"
          python -B packaging/assemble_notice_bundle.py --output "$RUNNER_TEMP/notices" --group "python=$RUNNER_TEMP/python-notices" --group "rust=$RUNNER_TEMP/rust-notices" --group "qtwebengine-source=$RUNNER_TEMP/qt-notices"
      - name: Render approved brand icons
        run: python -B packaging/build_brand_icons.py
      - name: Build Linux folder package
        env:
          NEXUS_CANDIDATE_NOTICES: ${{ runner.temp }}/notices
        run: |
          python -B packaging/prepare_public_variant.py --source . --destination "$RUNNER_TEMP/source-v1013" --version 1.0.13
          python -B -m PyInstaller --noconfirm --distpath "$RUNNER_TEMP/dist" --workpath "$RUNNER_TEMP/pyinstaller-work" "$RUNNER_TEMP/source-v1013/packaging/specs/NexusLauncherLinux.spec"
      - name: Frozen Linux window smoke with Chromium sandbox retained
        env:
          QT_QPA_PLATFORM: xcb
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          export XDG_DATA_HOME="$RUNNER_TEMP/smoke/data"
          timeout 90s dbus-run-session -- xvfb-run -a "$RUNNER_TEMP/dist/NEXUS-Linux-x64/nexus-launcher" --self-test-report "$RUNNER_TEMP/smoke/result.json" --preinstall-smoke
          python -c "import json,sys; p=json.load(open(sys.argv[1])); assert p['release_version']=='1.0.13' and p['loaded'] is True and p['application_icon'] is True and not p['script_errors'] and p['preinstall']['visible'] and p['preinstall']['cards']==5,p" "$RUNNER_TEMP/smoke/result.json"
      - name: Archive review artifact preserving Unix permissions
        run: |
          cp LICENSE COPYRIGHT.md "$RUNNER_TEMP/dist/NEXUS-Linux-x64/"
          cp packaging/README-Linux.md "$RUNNER_TEMP/dist/NEXUS-Linux-x64/README-Linux.md"
          tar -C "$RUNNER_TEMP/dist" -czf "$RUNNER_TEMP/NEXUS-1.0.13-Linux-x64.tar.gz" NEXUS-Linux-x64
          cd "$RUNNER_TEMP"
          sha256sum NEXUS-1.0.13-Linux-x64.tar.gz > SHA256SUMS-Linux.txt
      - name: Build and verify native POSIX auto-update fixtures
        env:
          NEXUS_CANDIDATE_NOTICES: ${{ runner.temp }}/notices
          QT_QPA_PLATFORM: xcb
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: |
          python -B packaging/posix_update_archive.py --bundle "$RUNNER_TEMP/dist/NEXUS-Linux-x64" --archive "$RUNNER_TEMP/NEXUS-Update-1.0.13-Linux-x64.zip" --platform linux --arch x64 --version 1.0.13 --inventory "$RUNNER_TEMP/posix-inventory-linux-x64.json"
          python -B packaging/prepare_public_variant.py --source . --destination "$RUNNER_TEMP/test-source-v1014" --version 1.0.14
          python -B -m PyInstaller --noconfirm --distpath "$RUNNER_TEMP/test-dist" --workpath "$RUNNER_TEMP/test-work" "$RUNNER_TEMP/test-source-v1014/packaging/specs/NexusLauncherLinux.spec"
          cp LICENSE COPYRIGHT.md "$RUNNER_TEMP/test-dist/NEXUS-Linux-x64/"
          cp packaging/README-Linux.md "$RUNNER_TEMP/test-dist/NEXUS-Linux-x64/README-Linux.md"
          python -B packaging/posix_update_archive.py --bundle "$RUNNER_TEMP/test-dist/NEXUS-Linux-x64" --archive "$RUNNER_TEMP/NEXUS-Fixture-1.0.14-Linux-x64.zip" --platform linux --arch x64 --version 1.0.14 --inventory "$RUNNER_TEMP/test-inventory.json"
          dbus-run-session -- xvfb-run -a python -B packaging/verify_posix_updates.py --initial "$RUNNER_TEMP/NEXUS-Update-1.0.13-Linux-x64.zip" --update "$RUNNER_TEMP/NEXUS-Fixture-1.0.14-Linux-x64.zip" --initial-inventory "$RUNNER_TEMP/posix-inventory-linux-x64.json" --update-inventory "$RUNNER_TEMP/test-inventory.json" --root "$RUNNER_TEMP/posix-update-owned" --output "$RUNNER_TEMP/posix-update-receipts" --platform linux --arch x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-linux-1.0.13-review
          retention-days: 14
          path: |
            ${{ runner.temp }}/NEXUS-1.0.13-Linux-x64.tar.gz
            ${{ runner.temp }}/SHA256SUMS-Linux.txt
            ${{ runner.temp }}/smoke/result.json
            ${{ runner.temp }}/smoke/result.png
            ${{ runner.temp }}/smoke/result-preinstall.png
            ${{ runner.temp }}/feature-tests.xml
            ${{ runner.temp }}/diagnostics.png
            ${{ runner.temp }}/trial-review.png
            ${{ runner.temp }}/trial-result.png
            ${{ runner.temp }}/NEXUS-Update-1.0.13-Linux-x64.zip
            ${{ runner.temp }}/posix-inventory-linux-x64.json
            ${{ runner.temp }}/posix-update-receipts/native-posix-update-acceptance.json
            ${{ runner.temp }}/posix-update-receipts/native-*.json
            ${{ runner.temp }}/posix-update-receipts/native-*.png
