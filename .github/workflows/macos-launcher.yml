name: macOS Apple Silicon review build

'on':
  workflow_dispatch:
  push:
    branches: [macos/verify-launcher]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TERM_COLOR: never
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install pinned build dependencies on Apple Silicon
        run: |
          test "$(uname -m)" = arm64
          python -m pip install --disable-pip-version-check -r requirements.txt -r packaging/requirements/requirements-media.txt -r packaging/requirements/requirements-markdown.txt pytest==9.1.1 maturin==1.15.0
          rustup toolchain install 1.99.1 --profile minimal
          echo 'RUSTUP_TOOLCHAIN=1.99.1' >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/nexus-target" >> "$GITHUB_ENV"
      - name: Build existing Rust extension for Apple Silicon
        run: |
          cargo test --locked -p nexus-core -p nexus-transport
          python -m maturin build --locked --release --manifest-path crates/nexus-python/Cargo.toml --out "$RUNNER_TEMP/wheels"
          python -m pip install --no-index --no-deps "$RUNNER_TEMP"/wheels/*.whl
      - name: Test Mac entrypoint and shared platform contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -B -m unittest discover -s tests -p test_macos_entrypoint.py -v
          python -B -m pytest tests/test_platform_support.py tests/test_nexus_account.py tests/test_registration.py -q -p no:cacheprovider
      - name: Collect component notices
        run: |
          curl --fail --location --max-time 180 'https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.3-src/pyside-setup-everywhere-src-6.8.3.tar.xz' --output "$RUNNER_TEMP/pyside-source.tar.xz"
          python -B packaging/collect_source_notices.py --archive "$RUNNER_TEMP/pyside-source.tar.xz" --sha256 d2c896f7f1a6a7ea4c9f98cfe317272fd139703ddf612b86999f09e48aeef0e6 --prefix pyside-setup-everywhere-src-6.8.3 --output "$RUNNER_TEMP/pyside-notices"
          python -B packaging/collect_linux_python_notices.py --output "$RUNNER_TEMP/python-notices" --pyside-notices "$RUNNER_TEMP/pyside-notices"
          cargo fetch --locked
          python -B packaging/collect_locked_rust_notices.py --lockfile Cargo.lock --cache "${CARGO_HOME:-$HOME/.cargo}/registry/cache" --output "$RUNNER_TEMP/rust-notices"
          curl --fail --location --max-time 180 'https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qtwebengine-everywhere-src-6.8.3.tar.xz' --output "$RUNNER_TEMP/qt-source.tar.xz"
          python -B packaging/collect_source_notices.py --archive "$RUNNER_TEMP/qt-source.tar.xz" --sha256 df4e19ba2b3a540551b6f998d62597377ffa688c1cff564589b7da2e2bf87337 --prefix qtwebengine-everywhere-src-6.8.3 --output "$RUNNER_TEMP/qt-notices"
          python -B packaging/assemble_notice_bundle.py --output "$RUNNER_TEMP/notices" --group "python=$RUNNER_TEMP/python-notices" --group "rust=$RUNNER_TEMP/rust-notices" --group "qtwebengine-source=$RUNNER_TEMP/qt-notices"
      - name: Render approved brand icons
        run: python -B packaging/build_brand_icons.py
      - name: Build macOS application bundle
        env:
          NEXUS_CANDIDATE_NOTICES: ${{ runner.temp }}/notices
        run: |
          python -B -m PyInstaller --noconfirm --distpath "$RUNNER_TEMP/dist" --workpath "$RUNNER_TEMP/pyinstaller-work" packaging/specs/NexusPublicMac.spec
      - name: Frozen native Cocoa window smoke
        env:
          QT_QPA_PLATFORM: cocoa
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          mkdir "$RUNNER_TEMP/smoke/home"
          python -c 'import subprocess,sys; subprocess.run([sys.argv[1],"--self-test-report",sys.argv[2]],check=True,timeout=90,env={**__import__("os").environ,"HOME":sys.argv[3]})' "$RUNNER_TEMP/dist/NEXUS Launcher.app/Contents/MacOS/NEXUS Launcher" "$RUNNER_TEMP/smoke/result.json" "$RUNNER_TEMP/smoke/home"
          python -c "import json,sys; p=json.load(open(sys.argv[1])); assert p['loaded'] is True and p['application_icon'] is True and not p['script_errors'],p" "$RUNNER_TEMP/smoke/result.json"
      - name: Verify ad-hoc integrity and archive review bundle
        run: |
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/dist/NEXUS Launcher.app"
          test "$(lipo -archs "$RUNNER_TEMP/dist/NEXUS Launcher.app/Contents/MacOS/NEXUS Launcher")" = arm64
          cp packaging/README-macOS.md "$RUNNER_TEMP/README-macOS.md"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/dist/NEXUS Launcher.app" "$RUNNER_TEMP/NEXUS-macOS-arm64-review.zip"
          cd "$RUNNER_TEMP"
          shasum -a 256 NEXUS-macOS-arm64-review.zip > SHA256SUMS-macOS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-macos-review
          retention-days: 5
          path: |
            ${{ runner.temp }}/NEXUS-macOS-arm64-review.zip
            ${{ runner.temp }}/SHA256SUMS-macOS.txt
            ${{ runner.temp }}/README-macOS.md
            ${{ runner.temp }}/smoke/result.json
            ${{ runner.temp }}/smoke/result.png
