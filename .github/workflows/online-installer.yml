name: Verify single EXE online installer
'on':
  workflow_dispatch:
  push:
    branches: [installer/verify-online]
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install existing pinned installer build dependencies
        run: |
          python -m pip install --disable-pip-version-check PySide6==6.8.3 PyInstaller==6.22.2 cryptography==50.0.1 pytest==9.1.1
          exit $LASTEXITCODE
      - name: Test signed provisioning and refusal paths without real launcher execution
        run: |
          python -B -m pytest tests/test_online_installation.py tests/test_bootstrap_installation.py tests/test_startup_update_flow.py tests/test_installer_bootstrap.py tests/test_github_updates.py -q -p no:cacheprovider
          exit $LASTEXITCODE
      - name: Collect bundled notices and build a single EXE
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NEXUS_CANDIDATE_NOTICES = "$env:RUNNER_TEMP\installer-notices"
          python -B -c "import importlib.metadata as m,runpy,sys; runpy.run_path('packaging/collect_python_notices.py')['collect'](sorted({d.metadata['Name'] for d in m.distributions() if d.metadata['Name']}),sys.argv[1])" $env:NEXUS_CANDIDATE_NOTICES
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -m PyInstaller --noconfirm --distpath "$env:RUNNER_TEMP\installer" --workpath "$env:RUNNER_TEMP\installer-work" packaging/specs/NexusOnlineInstaller.spec
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify the frozen installer opens without downloading or elevating
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:RUNNER_TEMP\installer\NEXUS-Setup.exe"
          $report = "$env:RUNNER_TEMP\installer\FROZEN-SETUP-SMOKE.json"
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test-report', $report) -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(90000)) { Stop-Process -Id $process.Id; throw 'Owned smoke process timed out' }
          if ($process.ExitCode -ne 0) { throw "Frozen installer exit $($process.ExitCode)" }
          $data = Get-Content -Raw $report | ConvertFrom-Json
          if (-not $data.window_visible -or $data.download_started -or $data.elevation_requested) { throw 'Invalid frozen smoke result' }
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File "$env:RUNNER_TEMP\installer\SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nexus-online-installer-review
          retention-days: 5
          path: ${{ runner.temp }}/installer/
