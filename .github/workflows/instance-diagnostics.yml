name: Instance diagnostics read-only verification
'on':
  push:
    branches: [diagnostics/verify-center, diagnostics/verify-trial]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PySide6==6.8.3
      - name: Bounded metadata and crash interpretation
        run: |
          python -B -m unittest discover -s tests -p test_instance_diagnostics.py -v
          exit $LASTEXITCODE
      - name: Native dialog, failure, cancellation and refresh
        env:
          NEXUS_DIAGNOSTICS_SCREENSHOT: ${{ runner.temp }}/instance-diagnostics.png
        run: |
          python -B -m unittest discover -s tests -p test_instance_diagnostics_ui.py -v
          exit $LASTEXITCODE
      - name: Trial copy integrity, stale plan, cleanup and launch exclusion
        run: |
          python -B -m unittest discover -s tests -p test_diagnostic_trial.py -v
          exit $LASTEXITCODE
      - name: Explicit trial confirmation and return to original
        env:
          NEXUS_TRIAL_REVIEW_SCREENSHOT: ${{ runner.temp }}/trial-confirmation.png
          NEXUS_TRIAL_RESULT_SCREENSHOT: ${{ runner.temp }}/trial-result.png
        run: |
          python -B -m unittest discover -s tests -p test_diagnostic_trial_ui.py -v
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: instance-diagnostics-review
          retention-days: 5
          path: |
            ${{ runner.temp }}/instance-diagnostics.png
            ${{ runner.temp }}/trial-confirmation.png
            ${{ runner.temp }}/trial-result.png
