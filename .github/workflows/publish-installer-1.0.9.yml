name: Publish verified Windows installer path fix 1.0.9
'on':
  push:
    branches: [release/publish-installer-1.0.9]
permissions:
  contents: write
  actions: read
concurrency:
  group: nexus-publish-installer-1.0.9
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: robloxksergg-creator/nexus-launcher
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact builds, full regression run and owner-signed acceptance
        run: |
          python - <<'PY'
          import json,os,urllib.request
          base='https://api.github.com/repos/'+os.environ['GH_REPO']
          def get(path):
            req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          rows=[(42053870064,13429665680,'6f682af01c1710ea3e0073d0c33aeb0b39387824f5570976ba9270390224291a','4f132b555ab6a1a20d3c8a548ed33d940c1b17ce'),(42053870097,13428331284,'6c03a8f67261e4d5e719a9ca57a0d48afd5847e856a56797b9ef1dfe50769c4a','4f132b555ab6a1a20d3c8a548ed33d940c1b17ce'),(42078557482,13439898813,'27aa057ee195d18bd3cabb4a0e5f558e23b994860cde24ca9ec61c11794ec6a4','32bf8437b3acaa95ec5c8dd7f3253c94912da733')]
          for run_id,artifact_id,sha,source in rows:
            run=get('/actions/runs/'+str(run_id));assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']==source
            a=get('/actions/artifacts/'+str(artifact_id));assert not a['expired'] and a['workflow_run']['id']==run_id and a['digest']=='sha256:'+sha
          print('Pinned build/full-suite/acceptance provenance PASS')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13429665680'
          run-id: 42053870064
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/inputs/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13428331284'
          run-id: 42053870097
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/inputs/installer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13439898813'
          run-id: 42078557482
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/inputs/acceptance
      - name: Verify package signatures and actual long-path native installation
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.1
          python -B packaging/prepare_public_variant.py --source . --destination "$RUNNER_TEMP/verification-source" --version 1.0.9
          export PYTHONPATH="$RUNNER_TEMP/verification-source"
          python -B packaging/releases/1.0.9/prepare.py --input "$RUNNER_TEMP/inputs" --output "$RUNNER_TEMP/release" --approval packaging/releases/1.0.9/approval.json
      - name: Snapshot and guard all existing platform feeds
        run: |
          mkdir "$RUNNER_TEMP/previous-feed"
          gh release download updates-preview --pattern '*envelope*.json' --dir "$RUNNER_TEMP/previous-feed"
          python - <<'PY'
          import pathlib,hashlib,os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'previous-feed'
          expected={'portable-envelope.json':'87a12f5b8562185b1b4178666a35bf7229cbc8e24214d601dfa4d996f5a2bc38','posix-envelope-linux-x64.json':'7ab4e7f985e780c600ebc56a2dd8d56b9ad4fa3c27d1aa8409d98f2adeba4f4f','posix-envelope-macos-arm64.json':'ff71c79f4fe04eb6cd616cb2c66dc3034870655f07b91ffec084e793d2a30710'}
          for name,sha in expected.items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha,'Existing feed changed: '+name
          PY
      - name: Publish Windows-only beta assets
        run: |
          if gh release view v1.0.9-preview.1 >/dev/null 2>&1; then echo 'Release exists; refusing overwrite'; exit 1; fi
          gh release create v1.0.9-preview.1 --target 4f132b555ab6a1a20d3c8a548ed33d940c1b17ce --title 'NEXUS Launcher 1.0.9 - Windows Installer Fix Beta' --notes-file "$RUNNER_TEMP/release/RELEASE-NOTES.md" --draft --prerelease "$RUNNER_TEMP/release/"*
          gh release edit v1.0.9-preview.1 --draft=false --prerelease --latest=false
      - name: Verify public assets before switching only Windows feed
        run: |
          python - <<'PY'
          import pathlib,hashlib,json,urllib.request,os
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GH_REPO']+'/releases/tags/v1.0.9-preview.1',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r:data=json.load(r)
          assert not data['draft'] and data['prerelease']
          assets={a['name']:a for a in data['assets']}
          for p in (pathlib.Path(os.environ['RUNNER_TEMP'])/'release').iterdir():
            with p.open('rb') as f:sha=hashlib.file_digest(f,'sha256').hexdigest()
            assert assets[p.name]['size']==p.stat().st_size and assets[p.name]['digest']=='sha256:'+sha,p.name
          PY
          for name in NEXUS-Setup.exe NEXUS-Managed-1.0.9-Windows-x64.zip portable-envelope.json; do
            curl --fail --silent --show-error --head --location --max-time 60 "https://github.com/$GH_REPO/releases/download/v1.0.9-preview.1/$name" >/dev/null
          done
          mkdir "$RUNNER_TEMP/feed-before-switch"
          gh release download updates-preview --pattern portable-envelope.json --dir "$RUNNER_TEMP/feed-before-switch"
          cmp "$RUNNER_TEMP/feed-before-switch/portable-envelope.json" "$RUNNER_TEMP/previous-feed/portable-envelope.json"
          gh release upload updates-preview "$RUNNER_TEMP/release/portable-envelope.json" --clobber
      - name: Verify Windows activation and unchanged POSIX feeds
        run: |
          mkdir "$RUNNER_TEMP/active-feed"
          gh release download updates-preview --pattern '*envelope*.json' --dir "$RUNNER_TEMP/active-feed"
          cmp "$RUNNER_TEMP/active-feed/portable-envelope.json" "$RUNNER_TEMP/release/portable-envelope.json"
          cmp "$RUNNER_TEMP/active-feed/posix-envelope-linux-x64.json" "$RUNNER_TEMP/previous-feed/posix-envelope-linux-x64.json"
          cmp "$RUNNER_TEMP/active-feed/posix-envelope-macos-arm64.json" "$RUNNER_TEMP/previous-feed/posix-envelope-macos-arm64.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nexus-1.0.9-publication-receipts
          retention-days: 5
          path: |
            ${{ runner.temp }}/previous-feed/*.json
            ${{ runner.temp }}/active-feed/*.json
            ${{ runner.temp }}/release/SHA256SUMS.txt
            ${{ runner.temp }}/release/windows-*.json
