name: Pre-install preparation report verification
'on':
  push:
    branches: [feature/preinstall-check]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: ${{ matrix.os == 'windows-2025' && 'windows' || matrix.os == 'macos-15' && 'cocoa' || 'offscreen' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt runtime libraries on disposable runner
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libpulse0 libasound2t64
      - name: Install existing pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r packaging/requirements/requirements-media.txt -r packaging/requirements/requirements-markdown.txt pytest==9.1.1
      - name: Preparation report, UI, bridge boundaries and feature regressions
        env:
          NEXUS_PREINSTALL_SCREENSHOT: ${{ runner.temp }}/preinstall-check.png
          NEXUS_PREINSTALL_NARROW_SCREENSHOT: ${{ runner.temp }}/preinstall-check-narrow.png
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export TMPDIR="$(python -c 'import os,tempfile; print(os.path.realpath(tempfile.gettempdir()))')"; fi
          python -B -m pytest tests/test_preinstall_check.py tests/test_preinstall_ui.py tests/test_design_action_boundary.py tests/test_instance_diagnostics.py tests/test_nested_diagnostics.py tests/test_dependency_versions.py tests/test_diagnostic_version_bindings.py tests/test_instance_diagnostics_ui.py tests/test_diagnostic_versions_ui.py tests/test_diagnostic_workspace_ui.py tests/test_diagnostic_trial.py tests/test_diagnostic_trial_ui.py tests/test_two_factor_ui.py tests/test_nexus_account.py tests/test_auth_state.py tests/test_platform_support.py -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/preinstall-tests.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: preinstall-check-${{ runner.os }}
          retention-days: 5
          path: |
            ${{ runner.temp }}/preinstall-check.png
            ${{ runner.temp }}/preinstall-check-narrow.png
            ${{ runner.temp }}/preinstall-tests.xml
