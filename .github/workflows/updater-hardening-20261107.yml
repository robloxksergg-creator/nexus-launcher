name: Updater reliability across desktop platforms
'on':
  push:
    branches: [verify/updater-hardening-20261107]
    paths:
      - 'crates/nexus-transport/src/lib.rs'
      - 'nexus_launcher/updater.py'
      - 'tests/test_pack_download_reliability.py'
      - 'nexus_launcher/resumable_download.py'
      - 'nexus_launcher/self_update.py'
      - 'nexus_launcher/portable_transition.py'
      - 'nexus_launcher/startup_portable_backend.py'
      - 'nexus_launcher/startup_update_flow.py'
      - 'tests/test_update_reliability.py'
      - 'packaging/verify_updater_hardening.py'
      - '.github/workflows/updater-hardening-20261107.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 cryptography==50.0.1
      - name: Test Rust transport (no external service requests)
        run: cargo test --locked -p nexus-transport
      - name: Test synthetic updates with outbound transport blocked
        run: python -B packaging/verify_updater_hardening.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: updater-hardening-${{ matrix.os }}
          retention-days: 5
          path: updater-hardening-results.xml
