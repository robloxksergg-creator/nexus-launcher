[workspace]
members = ["crates/nexus-core", "crates/nexus-transport", "crates/nexus-python"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"

[workspace.dependencies]
sha2 = "=0.11.1"
pyo3 = "=0.30.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "http2", "system-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
